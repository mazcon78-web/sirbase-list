<!DOCTYPE html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STUDIO B PRO</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>body{margin:0;background:#0a0a0a;color:#fff;font-family:system-ui;padding:10px}.card{background:#151515;border-radius:12px;padding:12px;margin:8px 0}.btn{padding:12px;border-radius:10px;border:0;font-weight:800;margin:3px}.g{background:#00ff88;color:#000}.r{background:#222;color:#fff}.o{background:#ff9500;color:#000}.y{background:#ffd700;color:#000}.redBlink{background:red;color:#fff;animation:b.8s infinite;width:100%;padding:18px;border-radius:12px;border:0;font-weight:900;font-size:18px}.greenLive{background:#00ff88;color:#000;width:100%;padding:18px;border-radius:12px;border:0;font-weight:900}.track{padding:10px;background:#1f1f1f;margin:4px 0;border-radius:6px}</style>
</head><body>
<h3>🎙️ STUDIO B PRO</h3>
<div class=card>
<audio id=player controls style="width:100%"></audio><br>
<button id=play class="btn g">▶ PLAY</button>
<button id=prev class="btn r">⏮ PREV</button>
<button id=next class="btn r">NEXT ⏭</button>
<button id=abbey class="btn o">ABBEY OFF</button><br>
<button id=micBtn class="btn r">🎤 MIC OFF</button>
<button id=echoBtn class="btn r">🎧 ECHO OFF</button>
<label class="btn y">+ ADD SONGS<input id=fileIn type=file accept=audio/* multiple hidden></label>
<button id=auto class="btn r">🔁 AUTO OFF</button>
<div id=pl style="max-height:150px;overflow:auto;background:#0e0e0e;padding:6px;border-radius:8px;margin-top:8px"></div>
</div>
<div class=card><div id=guestBox>No guest</div><audio id=guestAudio autoplay></audio></div>
<div class=card><button id=live style="width:100%;padding:18px;background:red;color:#fff;border:0;border-radius:12px;font-weight:900">🔴 GO LIVE</button></div>
<script>
const player=document.getElementById('player');let tracks=[{name:'ALHA-01.mp3',url:'./ALHA-01.mp3'}],cur=0,auto=false,ctx,dest,low,high,gain,echoD,echoG,abbeyOn=false,echoOn=false,micOn=false,micS,peer;
function render(){let h='';tracks.forEach((t,i)=>{h+=`<div class=track onclick="playIdx(${i})">${i+1}. ${t.name}</div>`});document.getElementById('pl').innerHTML=h}
window.playIdx=(i)=>{cur=i;player.src=tracks[i].url;render();player.play()}
function init(){if(ctx)return;ctx=new AudioContext();dest=ctx.createMediaStreamDestination();let src=ctx.createMediaElementSource(player);low=ctx.createBiquadFilter();low.type='lowshelf';low.frequency.value=250;high=ctx.createBiquadFilter();high.type='highshelf';high.frequency.value=4000;gain=ctx.createGain();echoD=ctx.createDelay();echoD.delayTime.value=.28;echoG=ctx.createGain();echoG.gain.value=0;src.connect(low);low.connect(high);high.connect(gain);gain.connect(ctx.destination);gain.connect(dest);gain.connect(echoD);echoD.connect(echoG);echoG.connect(gain)}
document.getElementById('fileIn').onchange=e=>{for(let f of e.target.files)tracks.push({name:f.name,url:URL.createObjectURL(f)});render()}
document.getElementById('play').onclick=()=>{init();if(!player.src)player.src=tracks[0].url;player.paused?player.play():player.pause()}
document.getElementById('prev').onclick=()=>{cur=(cur-1+tracks.length)%tracks.length;player.src=tracks[cur].url;player.play();render()}
document.getElementById('next').onclick=()=>{cur=(cur+1)%tracks.length;player.src=tracks[cur].url;player.play();render()}
document.getElementById('auto').onclick=function(){auto=!auto;this.innerText=auto?'AUTO ON':'AUTO OFF'}
document.getElementById('abbey').onclick=function(){init();abbeyOn=!abbeyOn;low.gain.value=abbeyOn?3:0;high.gain.value=abbeyOn?-2:0;this.innerText=abbeyOn?'ABBEY ON':'ABBEY OFF'}
document.getElementById('micBtn').onclick=async function(){init();if(!micOn){let s=await navigator.mediaDevices.getUserMedia({audio:true});ctx.createMediaStreamSource(s).connect(gain);micS=s;micOn=true;this.innerText='MIC LIVE'}else{micS.getTracks().forEach(t=>t.stop());micOn=false;this.innerText='MIC OFF'}}
document.getElementById('echoBtn').onclick=function(){init();echoOn=!echoOn;echoG.gain.value=echoOn?.3:0;this.innerText=echoOn?'ECHO ON':'ECHO OFF'}
player.onended=()=>{if(auto){cur=(cur+1)%tracks.length;player.src=tracks[cur].url;player.play();render()}};render()
peer=new Peer('sirdio-studio-b-master');peer.on('connection',c=>{c.on('data',d=>{if(d.type==='guest-request'){document.getElementById('guestBox').innerHTML=`<button id=ap class=redBlink>🔴 GUEST - TAP TO MAKE GREEN</button>`;document.getElementById('ap').onclick=()=>{let call=peer.call(d.peerId,dest.stream);call.on('stream',s=>{document.getElementById('guestAudio').srcObject=s;ctx.createMediaStreamSource(s).connect(gain)});document.getElementById('guestBox').innerHTML='<button class=greenLive>🟢 GUEST LIVE</button>'}}})})
</script></body></html>
