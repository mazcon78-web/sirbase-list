<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GUEST MIC</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><style>body{margin:0;background:#0a0a0a;color:#fff;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center}.box{background:#151515;padding:22px;border-radius:16px;width:90%;max-width:360px}.btn{width:100%;padding:20px;border-radius:12px;border:0;font-weight:900}.red{background:red;color:#fff;animation:b.8s infinite}.green{background:#00ff88;color:#000}.yellow{background:#ffd700}@keyframes b{50%{opacity:.4}}</style></head><body><div class=box><h2>🎤 GUEST</h2><p id=st>Tap to join</p><button id=req class="btn red">🔴 TAP TO JOIN LIVE</button></div><script>document.getElementById('req').onclick=async()=>{let s=await navigator.mediaDevices.getUserMedia({audio:true});let p=new Peer();p.on('open',id=>{let c=p.connect('sirdio-studio-b-master');c.on('open',()=>{c.send({type:'guest-request',peerId:id});document.getElementById('st').innerText='WAITING';document.getElementById('req').className='btn yellow';document.getElementById('req').innerText='WAITING...'})});p.on('call',call=>{call.answer(s);call.on('stream',()=>{document.getElementById('st').innerText='YOU ARE LIVE!';document.getElementById('req').className='btn green';document.getElementById('req').innerText='🟢 LIVE'})})}</script></body></html>
